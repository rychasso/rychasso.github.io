<section>
  <div class="poster">
    <img [src]="posterUrl" [alt]="project.title" />
    <span *ngIf="project.figures.length > 1" class="count">{{getCountMessage()}}</span>
  </div>

  <div class="card-info">
    <h2 class="title">{{project.title}}</h2>

    <ul class="tags-list">
      <li *ngFor="let tag of project.tags" class="tag">#{{getTagLocalization(tag)}}</li>
    </ul>
  </div>
</section>
